services:
  foodexpress:
    build: .
    container_name: foodexpress_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: foodexpress_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: foodexpress
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
